# =============================================================================
# Checks — fast checks on every push
# =============================================================================
# Runs on every push to any branch. Nothing here configures Loom or builds the
# mod, so results come back in a couple of minutes:
#   • Formatting (Spotless, via the standalone build in gradle/spotless)
#   • Semgrep SAST (community + Trail of Bits rules)
#   • Secret scanning (TruffleHog)
#   • Final gate job "Checks ✅" (required status check for branch protection)
#
# The build and the unit and GameTest suites run on pull requests
# (pull-request.yml); publishing runs on release tags (publish-curseforge.yml).
# Every branch is treated the same: protected branches only receive changes
# through pull requests, which have already passed both workflows.
#
# Don't use [skip ci] on commits: it skips this workflow entirely, so the
# required "Checks ✅" check never reports and the PR cannot be merged.
#
# Note: third-party actions are pinned to full commit SHAs (with a version
# comment) to satisfy Semgrep's supply-chain rules and prevent mutable-tag
# hijacking.
# =============================================================================

name: Checks

on:
  push:
    # Branches only; release tags are handled by publish-curseforge.yml.
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  # A newer push to the same branch supersedes the running checks.
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: "21"

jobs:
  # ===========================================================================
  # 1. Formatting (Spotless)
  # ===========================================================================
  spotless:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # Also validates the checksum of gradle/wrapper/gradle-wrapper.jar.
      # The Gradle cache is only written from the default branch.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # Must run from gradle/spotless; `-p gradle/spotless` does not work (see its settings.gradle).
      - name: Spotless check
        working-directory: gradle/spotless
        run: |
          if ! ../../gradlew spotlessCheck --no-daemon; then
            echo "::error::Formatting violations found. Run './gradlew spotlessApply' and commit the result."
            exit 1
          fi

  # ===========================================================================
  # 2. Semgrep SAST
  # ===========================================================================
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    container:
      # Pinned by digest; bump the tag and digest together when updating.
      image: semgrep/semgrep:1.179.0@sha256:93963d9295a366f59e4850127b1550400ee7b388f04fe144e4a1f6325d96e01b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config auto \
            --config p/trailofbits \
            --error \
            --exclude='build' \
            --exclude='.gradle' \
            --exclude='run' \
            --exclude='runs' \
            --json \
            --output=semgrep-results.json

      - name: Upload Semgrep report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: semgrep-report
          path: semgrep-results.json
          retention-days: 30

  # ===========================================================================
  # 3. Secret Scanning (TruffleHog)
  # ===========================================================================
  secrets-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: TruffleHog scan
        uses: trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85 # v3.97.9
        with:
          extra_args: --only-verified

  # ===========================================================================
  # 4. Final Gate — all checks must pass
  # ===========================================================================
  checks-ok:
    name: Checks ✅
    if: always()
    needs:
      - spotless
      - semgrep
      - secrets-scan
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate results
        env:
          SPOTLESS: ${{ needs.spotless.result }}
          SEMGREP: ${{ needs.semgrep.result }}
          SECRETS: ${{ needs.secrets-scan.result }}
        run: |
          echo "Formatting: ${SPOTLESS}"
          echo "Semgrep:    ${SEMGREP}"
          echo "Secrets:    ${SECRETS}"

          for result in "$SPOTLESS" "$SEMGREP" "$SECRETS"; do
            if [[ "$result" != "success" ]]; then
              echo "::error::One or more checks did not succeed"
              exit 1
            fi
          done

          echo "All checks passed!"
