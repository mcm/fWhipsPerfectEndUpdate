architectury {
    common rootProject.enabled_platforms.split(',')
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury:$rootProject.architectury_api_version"

    // Accessories (trinket slot, US-024). Loader-specific jars are added in fabric/ and neoforge/.
    modCompileOnly "io.wispforest:accessories-common:$rootProject.accessories_version"
}

dependencies {
    testImplementation platform("org.junit:junit-bom:$rootProject.junit_version")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

/*
 * Dev-only: writes the recolored placeholder textures to <root>/build/recolored-textures/ (laid out like a
 * resource pack) as a starting point for artists. Sources come from a local vanilla client jar: the one Loom
 * already downloaded, or -PclientJar=/path/to/client.jar. Nothing here is packaged into the mod.
 * Run with `./gradlew exportRecoloredTextures`.
 */
tasks.register('exportRecoloredTextures', JavaExec) {
    group = 'someonesperfectend'
    description = 'Writes the recolored textures from a local vanilla client jar to build/recolored-textures/'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'io.mcmaster.someonesperfectend.recolor.RecolorExport'
    def output = rootProject.layout.buildDirectory.dir('recolored-textures').get().asFile
    def resources = file('src/main/resources')
    def clientJarPath = providers.gradleProperty('clientJar')
            .orElse(providers.provider { loom.minecraftProvider.minecraftClientJar.absolutePath })
    doFirst {
        def clientJar = file(clientJarPath.get())
        if (!clientJar.isFile()) {
            throw new GradleException("Vanilla client jar not found at ${clientJar}; pass -PclientJar=<path>")
        }
        delete output
        args clientJar.absolutePath, output.absolutePath, resources.absolutePath
    }
}
