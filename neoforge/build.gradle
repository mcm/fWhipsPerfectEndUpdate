plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"

    modImplementation "io.wispforest:accessories-neoforge:$rootProject.accessories_version"
    modImplementation "com.github.glitchfiend:TerraBlender-neoforge:$rootProject.terrablender_version"
    // owo-lib (required by Accessories) jar-in-jars these plain libraries. In the dev/GameTest run jar-in-jar
    // isn't unpacked, so put the same versions on the game layer explicitly.
    forgeRuntimeLibrary('io.wispforest:endec:0.1.8.1') { transitive = false }
    forgeRuntimeLibrary('io.wispforest.endec:gson:0.1.5.1') { transitive = false }
    forgeRuntimeLibrary('io.wispforest.endec:jankson:0.1.5.1') { transitive = false }
    forgeRuntimeLibrary('io.wispforest.endec:netty:0.1.4.1') { transitive = false }
    forgeRuntimeLibrary('blue.endless:jankson:1.2.2') { transitive = false }

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

loom {
    // Interface injection from dependency mods (owo-lib, Forgified Fabric API) crashes Arch Loom's NeoForge setup
    // ("Cannot get MojangMappedMinecraftProvider before it has been setup"); we don't need those interfaces.
    interfaceInjection {
        enableDependencyInterfaceInjection = false
    }

    runs {
        // Headless GameTest server: `./gradlew :neoforge:runGameTestServer` (or `gameTestAll` at the root).
        gameTestServer {
            server()
            environment 'gametestserver'
            forgeTemplate 'gameTestServer'
            name 'NeoForge GameTest Server'
            runDir 'build/gametest'
            ideConfigGenerated false
            vmArg "-Xmx${rootProject.gametest_max_heap}"
            property 'neoforge.enabledGameTestNamespaces', rootProject.mod_id
        }
    }
}

rootProject.ext.configureGameTestTask(project, 'runGameTestServer')
