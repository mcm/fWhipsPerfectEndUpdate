/*
 * Standalone Gradle build that only runs Spotless, so the format check never configures Loom (which downloads and
 * remaps Minecraft). Its project dir is the repository root because Spotless only formats files inside the project.
 *
 * Run it from this directory (`cd gradle/spotless && ../../gradlew spotlessCheck`), or use the `spotlessCheck` and
 * `spotlessApply` tasks of the main build, which delegate here. `-p gradle/spotless` does not work.
 */
rootProject.name = 'someonesperfectend-spotless'
rootProject.projectDir = file('../..')
rootProject.buildFileName = 'gradle/spotless/spotless.gradle'
